name: Sync GitHub release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to mirror, for example v0.1.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-gitee-${{ github.event.release.tag_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror latest release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: chuxiajiurenzhan
      GITEE_REPO: video-agent-releases
      SOURCE_ARTIFACT_DIR: github-artifacts
      MIRROR_ARTIFACT_DIR: gitee-artifacts
      GITEE_PART_SIZE_BYTES: "10000000"

    steps:
      - name: Check out release repository
        uses: actions/checkout@v4

      - name: Resolve release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          test -n "$TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          PRERELEASE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
          echo "RELEASE_PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - name: Verify mirror credential
        run: |
          test -n "$GITEE_TOKEN" || {
            echo "::error::Repository secret GITEE_TOKEN is not configured."
            exit 1
          }

      - name: Download GitHub release assets
        run: |
          mkdir -p "$SOURCE_ARTIFACT_DIR"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$SOURCE_ARTIFACT_DIR"

      - name: Prepare Gitee mirror parts
        run: node scripts/prepare-gitee-mirror.mjs

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build Windows mirror downloader
        run: |
          VERSION="${RELEASE_TAG#v}"
          MANIFEST_NAME="YingJiStudio-Setup-${VERSION}-x64.gitee.json"
          MANIFEST_URL="https://gitee.com/$GITEE_OWNER/$GITEE_REPO/releases/download/$RELEASE_TAG/$MANIFEST_NAME"
          DOWNLOADER="$MIRROR_ARTIFACT_DIR/YingJiStudio-Setup-${VERSION}-x64-Gitee-Downloader.exe"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X main.manifestURL=$MANIFEST_URL" \
            -o "$DOWNLOADER" \
            ./gitee-downloader/main.go

      - name: Sync prepared assets to Gitee
        env:
          ARTIFACT_DIR: ${{ env.MIRROR_ARTIFACT_DIR }}
        run: node scripts/sync-release-to-gitee.mjs
